{{- if and .Values.webhook.tls.certManager.enabled (not .Values.webhook.tls.existingSecret) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "dependency-controller.webhook.tlsSecretName" . }}
  labels:
    {{- include "dependency-controller.labels" . | nindent 4 }}
spec:
  secretName: {{ include "dependency-controller.webhook.tlsSecretName" . }}
  dnsNames:
    - {{ include "dependency-controller.webhook.serviceFQDN" . }}
    - {{ include "dependency-controller.webhook.serviceFQDN" . }}.cluster.local
    {{- range .Values.webhook.tls.certManager.additionalDnsNames }}
    - {{ . }}
    {{- end }}
  issuerRef:
    name: {{ required "webhook.tls.certManager.issuerRef.name is required when cert-manager is enabled" .Values.webhook.tls.certManager.issuerRef.name }}
    kind: {{ .Values.webhook.tls.certManager.issuerRef.kind | default "ClusterIssuer" }}
{{- end }}
