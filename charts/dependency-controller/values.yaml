# BREAKING CHANGE: the top-level image.repository and image.tag keys used in
# chart versions <= 0.4.0 were removed. Set controller.image.repository/tag
# for the controller image and webhook.image.repository/tag for the webhook
# image instead — overrides of the old keys are silently ignored.
image:
  pullPolicy: IfNotPresent

imagePullSecrets: []

apiExportName: dependencies.opendefense.cloud

# Base kcp host URL (without workspace path). Used by the controller to resolve
# workspace paths to logical cluster names.
# If empty, derived from kubeconfig.
kcpBaseHost: ""

# Controller configuration.
controller:
  image:
    repository: ghcr.io/opendefensecloud/dependency-controller
    tag: "@sha256:b4417f0ea68d0742debc6d6a83fac317da995c7620fa66a8efdf49704034c4e3"

  replicas: 1

  # Secret containing a kubeconfig for connecting to kcp.
  # Required when the controller runs outside kcp (e.g., in a management cluster).
  kubeconfig:
    secretName: ""
    key: "kubeconfig"

  serviceAccount:
    create: true
    name: dependency-controller
    annotations: {}

  healthProbeBindAddress: ":8081"

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Webhook server configuration.
webhook:
  image:
    repository: ghcr.io/opendefensecloud/dependency-webhook
    tag: "@sha256:9adf9fad8c25c1a176c4eee632f6dfa2bc6cd846662943da79d6d76a3276dc57"

  replicas: 1

  port: 9443
  tlsCertDir: /etc/webhook-tls

  # Secret containing a kubeconfig for connecting to kcp.
  kubeconfig:
    secretName: ""
    key: "kubeconfig"

  serviceAccount:
    create: true
    name: dependency-webhook
    annotations: {}

  service:
    port: 443
    # Set to NodePort and specify nodePort to expose the webhook outside the cluster.
    type: ClusterIP
    nodePort: ""

  tls:
    # Use an existing Secret containing tls.crt, tls.key, and ca.crt.
    # When set, cert-manager is not used regardless of certManager.enabled.
    existingSecret: ""

    # Use cert-manager to issue a TLS certificate.
    certManager:
      enabled: false
      # issuerRef is required when certManager is enabled.
      issuerRef:
        name: ""
        kind: ClusterIssuer
      # Additional DNS names to include in the certificate.
      additionalDnsNames: []

  healthProbeBindAddress: ":8081"

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
