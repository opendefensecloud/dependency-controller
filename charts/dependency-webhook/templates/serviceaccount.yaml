{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dependency-webhook.serviceAccountName" . }}
  namespace: {{ .Values.serviceAccount.namespace | default .Release.Namespace }}
  labels:
    {{- include "dependency-webhook.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
