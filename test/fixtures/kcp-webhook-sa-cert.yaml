# Client certificate for the dependency-webhook service account.
# Issued by kcp's client CA so the webhook can connect to the kcp server
# directly. The CN and orgs encode the SA identity that kcp uses for
# authorization (matching the bootstrap RBAC subject and the controller's
# dynamic RBAC bindings).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kcp-webhook-sa-cert
  namespace: kcp-system
spec:
  commonName: "system:serviceaccount:dependency-system:dependency-webhook"
  issuerRef:
    name: kcp-client-issuer
  privateKey:
    algorithm: RSA
    size: 2048
  secretName: kcp-webhook-sa-cert
  subject:
    organizations:
      - "system:serviceaccounts"
      - "system:serviceaccounts:dependency-system"
  usages:
    - client auth
