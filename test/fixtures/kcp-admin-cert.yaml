# Client certificates for kcp admin access.
#
# The front-proxy cert is used by the test script (host) to manage workspaces
# via the front-proxy NodePort.
# The server cert is used by in-cluster pods (controller/webhook) to connect
# directly to the kcp server, including virtual workspace endpoints.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kcp-admin-front-proxy-cert
  namespace: kcp-system
spec:
  commonName: kcp-admin
  issuerRef:
    name: kcp-front-proxy-client-issuer
  privateKey:
    algorithm: RSA
    size: 2048
  secretName: kcp-admin-front-proxy-cert
  subject:
    organizations:
      - "system:kcp:admin"
  usages:
    - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kcp-admin-server-cert
  namespace: kcp-system
spec:
  commonName: kcp-admin
  issuerRef:
    name: kcp-client-issuer
  privateKey:
    algorithm: RSA
    size: 2048
  secretName: kcp-admin-server-cert
  subject:
    organizations:
      - "system:kcp:admin"
  usages:
    - client auth
