# Values for integration testing — both components deployed in kind,
# connecting to kcp via the front-proxy.
image:
  pullPolicy: Never

# kcpBaseHost is set dynamically via --set in the e2e test to match
# the actual front-proxy URL from kcp-operator.

controller:
  kubeconfig:
    secretName: kcp-controller-kubeconfig
    key: kubeconfig
  image:
    repository: dependency-controller
    tag: integration-test

webhook:
  kubeconfig:
    secretName: kcp-webhook-kubeconfig
    key: kubeconfig
  image:
    repository: dependency-controller
    tag: integration-test

  port: 9443

  service:
    type: ClusterIP
    port: 443

  tls:
    certManager:
      enabled: true
      issuerRef:
        name: selfsigned
        kind: ClusterIssuer
