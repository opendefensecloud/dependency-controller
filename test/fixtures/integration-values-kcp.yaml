# Values for integration testing — kcp deployed in kind via helm chart.
externalHostname: "kcp-front-proxy.kcp-system.svc.cluster.local"
externalPort: "8443"

certificates:
  dnsNames:
    - localhost
    - kcp-front-proxy.kcp-system.svc.cluster.local
    - kcp.kcp-system.svc.cluster.local

etcd:
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
  volumeSize: 1Gi

kcp:
  volumeClassName: standard
  extraFlags:
    - "--shard-base-url=https://kcp.kcp-system.svc.cluster.local:6443"
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi

kcpFrontProxy:
  service:
    type: NodePort
    nodePort: 31500
