# Values for integration testing — webhook deployed in kind, connecting to kcp server directly.
image:
  repository: dependency-controller
  tag: integration-test
  pullPolicy: Never

kubeconfig:
  secretName: kcp-webhook-kubeconfig
  key: kubeconfig

kcpBaseHost: "https://kcp.kcp-system.svc.cluster.local:6443"

webhookPort: 9443

service:
  type: ClusterIP
  port: 443
  targetPort: 9443

tls:
  certManager:
    enabled: true
    issuerRef:
      name: selfsigned
      kind: ClusterIssuer
