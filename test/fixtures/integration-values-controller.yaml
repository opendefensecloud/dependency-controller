# Values for integration testing — controller deployed in kind, connecting to kcp in-cluster.
image:
  repository: dependency-controller
  tag: integration-test
  pullPolicy: Never

kubeconfig:
  secretName: kcp-kubeconfig
  key: kubeconfig

kcpBaseHost: "https://kcp.local:8443"
rootShardHost: "https://kcp.local:8443"

webhook:
  url: https://dep-webhook-dependency-webhook.dependency-system.svc.cluster.local/validate
  caBundle:
    secretName: dep-webhook-dependency-webhook-tls
