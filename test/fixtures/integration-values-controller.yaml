# Values for integration testing — controller deployed in kind, connecting to kcp server directly.
image:
  repository: dependency-controller
  tag: integration-test
  pullPolicy: Never

kubeconfig:
  secretName: kcp-controller-kubeconfig
  key: kubeconfig

kcpBaseHost: "https://kcp.kcp-system.svc.cluster.local:6443"

webhook:
  url: https://dep-webhook-dependency-webhook.dependency-system.svc.cluster.local/validate
  caBundle:
    secretName: dep-webhook-dependency-webhook-tls
  serviceAccount:
    name: dependency-webhook
    namespace: dependency-system
