# Client certificate for the dependency-controller service account.
# Issued by kcp's client CA so the controller can connect to the kcp server
# directly (not via front-proxy).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kcp-controller-cert
  namespace: kcp-system
spec:
  commonName: "system:serviceaccount:dependency-system:dependency-controller"
  issuerRef:
    name: kcp-client-issuer
  privateKey:
    algorithm: RSA
    size: 2048
  secretName: kcp-controller-cert
  subject:
    organizations:
      - "system:serviceaccounts"
      - "system:serviceaccounts:dependency-system"
  usages:
    - client auth
