# Bootstrap cert with system:masters for e2e setup only.
# Used to seed initial RBAC grants in system:master workspace.
# NOT used by any deployed component.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kcp-bootstrap-cert
  namespace: kcp-system
spec:
  commonName: "e2e-bootstrap"
  issuerRef:
    name: kcp-client-issuer
  privateKey:
    algorithm: RSA
    size: 2048
  secretName: kcp-bootstrap-cert
  subject:
    organizations:
      - "system:masters"
  usages:
    - client auth
