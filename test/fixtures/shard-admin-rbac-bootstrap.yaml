# RBAC in kcp's system:admin logical cluster, granting the webhook SA
# shard-wide read access to apiexports/content and apiexportendpointslices.
# Applied via a shard-specific kubeconfig using a system:kcp:admin identity.
#
# system:admin RBAC is evaluated by the Bootstrap Policy Authorizer for
# every request on the shard, so this single grant replaces the per-workspace
# ClusterRole/ClusterRoleBinding that the controller previously managed.
# In a multi-shard setup, this RBAC must be applied to each shard's
# system:admin workspace.
#
# - apiexports/content: required for VW authorization (VW URLs point to shards)
# - apiexportendpointslices: required for provider ESS discovery — the dep-ctrl
#   VW does not expose kcp-internal types (apis.kcp.io) in API discovery, so
#   direct workspace access is needed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-controller-webhook-apiexport-reader
rules:
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports/content"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexportendpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-controller-webhook-apiexport-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-controller-webhook-apiexport-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "system:serviceaccount:dependency-system:dependency-webhook"
