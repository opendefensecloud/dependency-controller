# RBAC in kcp's system:admin logical cluster, granting shard-wide access
# for both the webhook and controller SAs. Applied via a shard-specific
# kubeconfig using a system:kcp:admin identity.
#
# system:admin RBAC is evaluated by the Bootstrap Policy Authorizer for
# every request on the shard, so these grants apply across all workspaces.
# In a multi-shard setup, this RBAC must be applied to each shard's
# system:admin workspace.
#
# - Webhook SA: apiexports/content + apiexportendpointslices read access
# - Controller SA: validatingwebhookconfigurations management (the webhook
#   installer creates direct workspace clients, not VW clients)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-controller-webhook-apiexport-reader
rules:
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports/content"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexportendpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-controller-webhook-apiexport-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-controller-webhook-apiexport-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "system:serviceaccount:dependency-system:dependency-webhook"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-controller-webhook-installer
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-controller-webhook-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-controller-webhook-installer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "system:serviceaccount:dependency-system:dependency-controller"
