# Minimal RBAC in the root workspace for the dependency-controller system.
# Applied during setup using a bootstrap (system:masters) identity.
#
# In kcp, the webhook SA needs workspaces/content access in root to enter
# child workspaces through APIExport virtual workspace endpoints.
# The apiexports/content RBAC in each provider workspace is managed
# dynamically by the controller's RBACManager.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-controller-webhook
rules:
  - apiGroups: ["core.kcp.io"]
    resources: ["workspaces/content"]
    verbs: ["access"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-controller-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-controller-webhook
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "system:serviceaccount:dependency-system:dependency-webhook"
