# NodePort service exposing the kcp server directly (not the front-proxy).
# VW paths (/services/apiexport/...) are only served by the kcp server,
# so e2e tests need direct access to verify RBAC via VW requests.
apiVersion: v1
kind: Service
metadata:
  name: kcp-server-nodeport
  namespace: kcp-system
spec:
  type: NodePort
  ports:
    - protocol: TCP
      name: kcp
      port: 6443
      targetPort: 6443
      nodePort: 31501
  selector:
    app.kubernetes.io/name: kcp
    app.kubernetes.io/instance: kcp
    app.kubernetes.io/component: server
