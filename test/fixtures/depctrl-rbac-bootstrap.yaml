# RBAC in the dep-ctrl workspace for the dependency-controller.
# Applied during setup using a privileged identity (e.g., system:masters).
#
# Both components connect to the dep-ctrl workspace to:
# 1. Discover the VW URL via APIExportEndpointSlice
# 2. Access the dep-ctrl APIExport's virtual workspace (apiexports/content)
#
# The controller additionally manages permissionClaims on the APIExport
# (to dynamically claim dependent resource types) and manages webhooks
# in binding workspaces via the VW.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-controller-depctrl
rules:
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexportendpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports"]
    resourceNames: ["dependencies.opendefense.cloud"]
    verbs: ["get", "update"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports/content"]
    resourceNames: ["dependencies.opendefense.cloud"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-controller-depctrl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-controller-depctrl
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "system:serviceaccount:dependency-system:dependency-controller"
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "system:serviceaccount:dependency-system:dependency-webhook"
