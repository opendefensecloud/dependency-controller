# RBAC in the dep-ctrl workspace for the dependency-controller.
# Applied during setup using a bootstrap (system:masters) identity.
#
# The controller connects to the dep-ctrl workspace to:
# 1. Discover the VW URL via APIExportEndpointSlice
# 2. Access the dep-ctrl APIExport's virtual workspace (apiexports/content)
#
# The controller needs full CRUD on apiexports/content because it manages
# webhooks in binding workspaces via the VW (using permissionClaims).
#
# The webhook SA's access is granted shard-wide via system:admin RBAC
# (see shard-admin-rbac-bootstrap.yaml) instead of per-workspace grants.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-controller
rules:
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexportendpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports/content"]
    resourceNames: ["dependencies.opendefense.cloud"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-controller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "system:serviceaccount:dependency-system:dependency-controller"
